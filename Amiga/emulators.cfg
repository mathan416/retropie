amiberry = "/opt/retropie/emulators/amiberry/amiberry.sh auto %ROM%"
default = "amiberry-a500"
amiberry-a500 = "/opt/retropie/emulators/amiberry/amiberry_a1200.sh -config /opt/retropie/emulators/amiberry/conf/rp-a500.uae %ROM%"
amiberry-a1200 = "/opt/retropie/emulators/amiberry/amiberry_a1200.sh -config /opt/retropie/emulators/amiberry/conf/rp-a1200.uae %ROM%"
amiberry-cd32 = "/opt/retropie/emulators/amiberry/amiberry_cd32.sh -config /opt/retropie/emulators/amiberry/conf/rp-CD32.uae %ROM%"
lr-puae = "/opt/retropie/emulators/retroarch/bin/retroarch -L /opt/retropie/libretrocores/lr-puae/puae_libretro.so --config /opt/retropie/configs/amiga/retroarch.cfg %ROM%"
lr-uae4arm = "/opt/retropie/emulators/retroarch/bin/retroarch -L /opt/retropie/libretrocores/lr-uae4arm/uae4arm_libretro.so --config /opt/retropie/configs/amiga/retroarch.cfg %ROM%"
lr-puae2021 = "/opt/retropie/emulators/retroarch/bin/retroarch -L /opt/retropie/libretrocores/lr-puae2021/puae2021_libretro.so --config /opt/retropie/configs/amiga/retroarch.cfg %ROM%"
